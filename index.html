<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Resetombolan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: full-bleed 3D salon (bottle-green damask, gilt frames, brass tombola); controls dock right on wide screens, bottom sheet on phones */
:root{
  color-scheme: dark;
  --ink:#0a110f;
  --velvet:#14302a;
  --panel:rgba(11,19,17,.82);
  --panel-solid:#101b18;
  --line:rgba(214,178,98,.30);
  --line-soft:rgba(242,232,210,.12);
  --brass:#d8b468;
  --brass-deep:#a07c34;
  --ivory:#f3ead6;
  --mist:rgba(243,234,214,.68);
  --faint:rgba(243,234,214,.42);
  --ruby:#d4566a;
  --jade:#7fd6bd;
  --f-display:"Gloock","Bodoni 72",Didot,"Times New Roman",Georgia,serif;
  --f-body:"Hanken Grotesk","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:16px;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--ink);color:var(--ivory);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--ink)}
.brand{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none;z-index:3}
.mark{font-family:var(--f-display);font-size:clamp(24px,4.2vw,34px);line-height:1;letter-spacing:.01em;color:var(--ivory);text-shadow:0 2px 18px rgba(0,0,0,.55)}
.mark small{display:block;margin-top:6px;font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--brass)}
.role{pointer-events:auto;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);background:var(--brass);padding:6px 10px 5px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.role.quiet{background:rgba(243,234,214,.12);color:var(--ivory);border:1px solid var(--line-soft)}

.dock{position:fixed;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 50px rgba(0,0,0,.45);backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);overflow:auto;overscroll-behavior:contain;
  left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-height:46%;padding:16px 16px 18px}
@media (min-width:820px) and (min-aspect-ratio:11/10){
  .dock{left:auto;right:20px;top:20px;bottom:auto;width:360px;max-height:calc(100% - 40px);padding:20px 20px 22px}
  .brand{padding-right:404px}
}
.dock > * + *{margin-top:12px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin:0}
.dock h2{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.08;margin:6px 0 0;text-wrap:balance;color:var(--ivory)}
.dock h2.winner{font-size:40px;color:var(--brass)}
.muted{color:var(--mist);margin:0}
.small{font-size:13px}
.note{font-size:13px;color:var(--faint);margin:0}
.error{font-size:14px;color:var(--ruby);margin:0}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{appearance:none;border:0;font:inherit;font-weight:600;letter-spacing:.01em;border-radius:12px;min-height:46px;padding:0 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s ease,filter .15s ease,background .15s ease}
.btn:focus-visible,.chip:focus-visible,.link:focus-visible,.icon:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn.primary{background:linear-gradient(180deg,#ecd08c,#c99b45 55%,#a87c2e);color:#1a1206;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 20px rgba(201,155,69,.25)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.primary:active{transform:translateY(1px)}
.btn.big{min-height:54px;font-size:17px;flex:1 1 100%}
.btn.ghost{background:transparent;color:var(--ivory);border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(216,180,104,.08)}
.btn.tiny{min-height:32px;padding:0 10px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:default;filter:none;transform:none}
.link{appearance:none;background:none;border:0;padding:0;font:inherit;font-size:14px;color:var(--brass);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.chip{appearance:none;font:inherit;font-size:13px;font-weight:600;color:var(--ivory);background:rgba(243,234,214,.07);border:1px solid var(--line-soft);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip:hover{border-color:var(--line)}
.preview{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.names{display:grid;gap:8px}
.name-row,.rowhead{display:grid;grid-template-columns:20px minmax(0,1fr) 106px 34px;align-items:center;gap:8px}
.rowhead{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.rowhead span:nth-child(3){text-align:center}
.stepper{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;height:42px;border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;background:rgba(0,0,0,.28)}
.step{appearance:none;border:0;height:100%;background:rgba(243,234,214,.06);color:var(--ivory);font:inherit;font-size:18px;cursor:pointer}
.step:hover{background:rgba(216,180,104,.14)}
.step:disabled{opacity:.3;cursor:default}
.step:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.count{text-align:center;font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.name-row .num{font-family:var(--f-mono);font-size:12px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
input[type=text],input[type=password]{width:100%;min-width:0;font:inherit;font-size:16px;color:var(--ivory);background:rgba(0,0,0,.28);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px}
input::placeholder{color:var(--faint)}
.code-form{display:flex;gap:10px;flex-wrap:wrap}
.code-form input{flex:1 1 160px;font-family:var(--f-mono);font-size:20px;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.code-form .btn{flex:0 0 auto}
.icon{appearance:none;border:1px solid var(--line-soft);background:transparent;color:var(--mist);width:34px;height:34px;border-radius:9px;font-size:18px;line-height:1;cursor:pointer}
.codes{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--line-soft)}
.codes li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.codes .who{display:grid;gap:2px;min-width:0}
.codes .who strong{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.codes .who strong span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.codes .who small{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.ok{color:var(--jade)}
.codes code{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;color:var(--brass);user-select:all;font-variant-numeric:tabular-nums}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--jade)}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
details{border-top:1px solid var(--line-soft);padding-top:10px}
summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--mist);list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" +";color:var(--brass)}
details[open] summary::after{content:" −"}
.hist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px;font-size:13px;color:var(--mist)}
.hist li{display:flex;justify-content:space-between;gap:12px}
.hist time{font-family:var(--f-mono);font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.result{text-align:left}
.result .eyebrow{color:var(--brass)}
.result h2{font-size:clamp(34px,7vw,48px)}
.result.gold h2{background:linear-gradient(180deg,#fff1c4,#e2b354 60%,#b88430);-webkit-background-clip:text;background-clip:text;color:transparent}
.result.calm h2{color:var(--ivory)}
.result .lead{font-size:16px;color:var(--mist);margin:0}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);z-index:6;background:var(--panel-solid);color:var(--ivory);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.boot{position:fixed;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none;font-family:var(--f-display);font-size:22px;color:var(--faint);transition:opacity .6s ease}
.boot.gone{opacity:0}
@media (prefers-reduced-motion:reduce){.status::before{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Tombola i en salong med tre tavlor: 2025, 2026 och 2027"></canvas>
<div class="boot" id="boot">Ställer fram trumman…</div>
<header class="brand" id="brand">
  <div class="mark">Resetombolan<small>Vem blir vald?</small></div>
  <div class="role quiet" id="role">Ansluter</div>
</header>
<aside class="dock" id="panel" aria-live="polite"></aside>
<section class="dock result" id="result" role="dialog" aria-labelledby="res-h" hidden>
  <p class="eyebrow" id="res-eyebrow"></p>
  <h2 id="res-h"></h2>
  <p class="lead" id="res-sub"></p>
  <div class="actions"><button class="btn primary" id="res-close" type="button">Stäng</button></div>
</section>
<div class="toast" id="toast" role="status" hidden></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const $ = (s) => document.querySelector(s);
const panelEl = $("#panel"), resultEl = $("#result"), roleEl = $("#role"), brandEl = $("#brand");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wideMQ = matchMedia("(min-width: 820px) and (min-aspect-ratio: 11/10)");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const smoother = (t) => { t = clamp(t, 0, 1); return t * t * t * (t * (t * 6 - 15) + 10); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* =========================================================
   Renderer, scene, post
   ========================================================= */
const canvas = $("#scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060a09);
scene.fog = new THREE.Fog(0x060a09, 18, 46);
const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 120);
camera.position.set(0, 4, 13);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(512, 512), 0.38, 0.6, 0.86);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function buildEnv() {
  const s = new THREE.Scene();
  const box = new THREE.Mesh(new THREE.BoxGeometry(30, 14, 30), new THREE.MeshBasicMaterial({ color: new THREE.Color(0x0c1814), side: THREE.BackSide }));
  box.position.y = 5; s.add(box);
  const panel = (w, h, x, y, z, col, k) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(k), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 2, 0); s.add(m);
  };
  panel(9, 3, 0, 11.5, 2, 0xffe2b0, 5);
  panel(3, 6, -13, 5, 4, 0xffd09a, 2.6);
  panel(3, 6, 13, 6, -3, 0xbfe8d8, 1.3);
  panel(12, 2.5, 0, 3, 14, 0xfff0d8, 1.8);
  panel(1.6, 1.6, 6, 9, 8, 0xffffff, 12);
  panel(1.2, 1.2, -5, 7, 9, 0xffe8c8, 8);
  const pm = new THREE.PMREMGenerator(renderer);
  const tex = pm.fromScene(s, 0.02).texture; pm.dispose();
  return tex;
}
scene.environment = buildEnv();
scene.environmentIntensity = 0.6;

/* =========================================================
   Canvas painting helpers
   ========================================================= */
function cv(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return { c, x: c.getContext("2d") }; }
function tex(c, { repeat, srgb = true, aniso = 8 } = {}) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(aniso, renderer.capabilities.getMaxAnisotropy());
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function grain(x, w, h, amt = 14, seed = 7) {
  const R = mulberry32(seed); const img = x.getImageData(0, 0, w, h); const d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (R() - 0.5) * amt; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  x.putImageData(img, 0, 0);
}
function vignette(x, w, h, s = 0.5) {
  const g = x.createRadialGradient(w / 2, h / 2, h * 0.32, w / 2, h / 2, h * 0.9);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, `rgba(0,0,0,${s})`);
  x.fillStyle = g; x.fillRect(0, 0, w, h);
}
function spike(x, px, py, hw, h) { x.beginPath(); x.moveTo(px - hw, py); x.lineTo(px, py - h); x.lineTo(px + hw, py); x.closePath(); x.fill(); }
function lancet(x, lx, ly, w, h) {
  x.beginPath(); x.moveTo(lx, ly); x.lineTo(lx, ly - h + w);
  x.quadraticCurveTo(lx, ly - h, lx + w / 2, ly - h - w * 0.35);
  x.quadraticCurveTo(lx + w, ly - h, lx + w, ly - h + w); x.lineTo(lx + w, ly); x.closePath(); x.fill();
}

/* --- 2025: Köln + Phantasialand --- */
function paint2025() {
  const W = 1024, H = 768; const { c, x } = cv(W, H); const R = mulberry32(2025);
  let g = x.createLinearGradient(0, 0, 0, 600);
  g.addColorStop(0, "#1c1640"); g.addColorStop(0.32, "#46285c"); g.addColorStop(0.6, "#a3476b");
  g.addColorStop(0.82, "#ec8c5c"); g.addColorStop(1, "#ffcf8c");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 80; i++) { x.fillStyle = `rgba(255,240,220,${0.12 + R() * 0.45})`; x.fillRect(R() * W, R() * 230, 1.6, 1.6); }
  g = x.createRadialGradient(700, 560, 8, 700, 560, 300);
  g.addColorStop(0, "rgba(255,240,200,1)"); g.addColorStop(0.16, "rgba(255,218,150,.95)"); g.addColorStop(0.17, "rgba(255,190,120,.5)"); g.addColorStop(1, "rgba(255,140,90,0)");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // distant haze
  x.fillStyle = "rgba(110,46,86,.5)"; x.beginPath(); x.moveTo(0, 590);
  for (let i = 0; i <= 24; i++) x.lineTo(i * W / 24, 556 - Math.sin(i * 0.8) * 9 - R() * 16);
  x.lineTo(W, 600); x.lineTo(0, 600); x.fill();
  // Rhine
  g = x.createLinearGradient(0, 580, 0, H); g.addColorStop(0, "#80506f"); g.addColorStop(0.35, "#43294f"); g.addColorStop(1, "#191130");
  x.fillStyle = g; x.fillRect(0, 580, W, H - 580);
  for (let i = 0; i < 42; i++) {
    const yy = 588 + i * 4.3 + R() * 3; const w = (150 - i * 2.8) * (0.55 + R() * 0.6);
    x.fillStyle = `rgba(255,212,150,${Math.max(0, 0.55 - i * 0.012)})`; x.fillRect(700 - w / 2 + (R() - 0.5) * 34, yy, w, 1.7);
  }
  // Hohenzollernbrücke
  const dy = 566, bc = "#2c1d3f";
  x.fillStyle = bc; x.strokeStyle = bc; x.fillRect(-10, dy - 8, 1000, 13);
  const qy = (a, b, y0, h, px) => { const t = clamp((px - a) / (b - a), 0, 1); return y0 - 4 * h * t * (1 - t); };
  for (const [a, b] of [[110, 360], [360, 610], [610, 860]]) {
    const mid = (a + b) / 2, h = 92;
    x.lineWidth = 7; x.beginPath(); x.moveTo(a, dy - 6); x.quadraticCurveTo(mid, dy - 6 - 2 * h, b, dy - 6); x.stroke();
    x.lineWidth = 4; x.beginPath(); x.moveTo(a + 16, dy - 6); x.quadraticCurveTo(mid, dy - 6 - 2 * (h - 30), b - 16, dy - 6); x.stroke();
    x.lineWidth = 2;
    for (let i = 1; i < 16; i++) {
      const px = a + 16 + (b - a - 32) * i / 16;
      const yo = qy(a, b, dy - 6, h, px), yi = qy(a + 16, b - 16, dy - 6, h - 30, px);
      x.beginPath(); x.moveTo(px, yo); x.lineTo(px + (i % 2 ? 8 : -8), yi); x.stroke();
      x.beginPath(); x.moveTo(px, yi); x.lineTo(px, dy - 6); x.stroke();
    }
  }
  for (const px of [110, 360, 610, 860]) x.fillRect(px - 12, dy - 12, 24, 44);
  // bank + low houses
  x.fillStyle = "#1a1229"; x.fillRect(-10, 578, 720, 18);
  for (let px = -10; px < 190; px += 26 + R() * 10) { const hh = 26 + R() * 30; x.fillRect(px, 580 - hh, 24, hh); spike(x, px + 12, 580 - hh, 13, 12); }
  // Kölner Dom
  const col = "#1b132f", win = "rgba(255,170,110,.32)";
  const cx = 300, by = 590;
  const tower = (tx) => {
    x.fillStyle = col; x.beginPath();
    x.moveTo(tx - 38, by); x.lineTo(tx - 38, by - 232); x.lineTo(tx - 30, by - 232); x.lineTo(tx - 30, by - 300);
    x.lineTo(tx - 24, by - 300); x.lineTo(tx - 24, by - 340); x.lineTo(tx + 24, by - 340); x.lineTo(tx + 24, by - 300);
    x.lineTo(tx + 30, by - 300); x.lineTo(tx + 30, by - 232); x.lineTo(tx + 38, by - 232); x.lineTo(tx + 38, by); x.closePath(); x.fill();
    for (const [px, py, ph] of [[tx - 36, by - 232, 34], [tx + 36, by - 232, 34], [tx - 28, by - 300, 30], [tx + 28, by - 300, 30], [tx - 22, by - 340, 22], [tx + 22, by - 340, 22]]) spike(x, px, py, 5, ph);
    x.beginPath(); x.moveTo(tx - 24, by - 340); x.lineTo(tx, by - 505); x.lineTo(tx + 24, by - 340); x.closePath(); x.fill();
    for (let i = 1; i < 10; i++) {
      const t = i / 10, yy = by - 340 - 165 * t, half = 24 * (1 - t);
      x.beginPath(); x.moveTo(tx - half, yy); x.lineTo(tx - half - 6, yy - 4); x.lineTo(tx - half + 2, yy - 10); x.fill();
      x.beginPath(); x.moveTo(tx + half, yy); x.lineTo(tx + half + 6, yy - 4); x.lineTo(tx + half - 2, yy - 10); x.fill();
    }
    x.fillRect(tx - 1.5, by - 524, 3, 22); x.fillRect(tx - 7, by - 516, 14, 3);
    x.fillStyle = win;
    lancet(x, tx - 15, by - 214, 10, 72); lancet(x, tx + 5, by - 214, 10, 72); lancet(x, tx - 7, by - 292, 14, 46);
    lancet(x, tx - 13, by - 118, 9, 58); lancet(x, tx + 4, by - 118, 9, 58);
  };

let last = performance.now(), T = 0;

  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  updateAnim(dt);

  syncBallMeshes(dt);
  drum.rotation.x = drumTheta;

        h("small", {}, `${kulor(p.balls)} · ${pct(p.balls, total)}`, p.joined ? h("span", { class: "ok" }, " · inne") : null)),
      h("code", { text: p.code }),
      h("button", { class: "btn ghost tiny", type: "button", "aria-label": `Kopiera länken till ${p.name}`, onclick: (e) => copyText(`Hej ${p.name}! Här är din lott till tombolan: ${personalLink(p.code)}`, e.currentTarget) }, "Kopiera länk"))));
}
function previewRow(label, kinds) {
  return h("div", { class: "preview" }, h("span", { class: "muted small" }, label),
    kinds.map(([k, t]) => h("button", { class: "chip", type: "button", disabled: !!anim, onclick: () => demo(k) }, t)));
}
function setupView(existing) {
  const total = S.setup.reduce((s, p) => s + p.balls, 0);
  return {
    key: `a-setup|${S.setup.map((p) => p.balls).join(",")}|${S.busy}|${S.editing}|${existing}|${S.confirmRegen}`,
    build: () => [
      h("p", { class: "eyebrow" }, "Admin"),
      h("h2", {}, existing ? "Deltagare och kulor" : "Vilka är med?"),
      h("p", { class: "muted" }, "Skriv in namnen och välj hur många kulor var och en har i trumman. Fler kulor ger större chans. Du som admin är inte med."),
      h("div", { class: "rowhead", "aria-hidden": "true" }, h("span"), h("span", {}, "Namn"), h("span", {}, "Kulor"), h("span")),
      h("div", { class: "names" }, S.setup.map((p, i) => h("div", { class: "name-row" },
        h("span", { class: "num" }, String(i + 1)),
        h("label", { class: "sr", for: `name-${i}` }, `Namn ${i + 1}`),
        h("input", { id: `name-${i}`, type: "text", value: p.name, maxlength: "30", autocomplete: "off", placeholder: `Namn ${i + 1}`, oninput: (e) => { S.setup[i].name = e.target.value; } }),
        h("div", { class: "stepper", role: "group", "aria-label": `Kulor för person ${i + 1}` },
          h("button", { class: "step", type: "button", "aria-label": "En kula färre", disabled: p.balls <= 1, onclick: () => { S.setup[i].balls = Math.max(1, p.balls - 1); renderPanel(true); } }, "−"),
          h("span", { class: "count", "aria-live": "polite", text: String(p.balls) }),
          h("button", { class: "step", type: "button", "aria-label": "En kula till", disabled: p.balls >= 10, onclick: () => { S.setup[i].balls = Math.min(10, p.balls + 1); renderPanel(true); } }, "+")),
        S.setup.length > 2 ? h("button", { class: "icon", type: "button", "aria-label": `Ta bort person ${i + 1}`, onclick: () => { S.setup.splice(i, 1); renderPanel(true); } }, "×") : h("span", {})))),
      S.setup.length < 12 ? h("button", { class: "link", type: "button", onclick: () => { S.setup.push({ name: "", balls: 1 }); renderPanel(true); $(`#name-${S.setup.length - 1}`)?.focus(); } }, "Lägg till en person") : null,
      h("p", { class: total > 60 ? "error" : "note" }, total > 60 ? `${total} kulor. Högst 60 får plats i trumman.` : `Totalt ${kulor(total)} i trumman.`),
      h("div", { class: "actions" },
        h("button", { class: "btn primary", type: "button", disabled: S.busy, onclick: () => onSavePeople(false) }, S.busy ? "Sparar…" : existing ? "Spara ändringar" : "Skapa lotter"),
        existing ? h("button", { class: "btn ghost", type: "button", onclick: () => { S.editing = false; S.confirmRegen = false; S.setup = S.adm.people.map((p) => ({ name: p.name, balls: p.balls })); renderPanel(true); } }, "Avbryt") : null),
      existing ? h("p", { class: "note" }, "Den som redan har en kod behåller den. Nya personer får en ny kod.") : h("p", { class: "note" }, "Varje person får en egen länk med kod. Koden avgör vad just den personen ser."),
      existing ? h("button", { class: "link", type: "button", disabled: S.busy, onclick: () => { if (S.confirmRegen) onSavePeople(true); else { S.confirmRegen = true; renderPanel(true); } } }, S.confirmRegen ? "Tryck igen: alla får nya koder och de gamla slutar fungera" : "Ge alla nya koder") : null,
      !existing ? previewRow("Testa trumman:", [["admin", "Som admin"], ["won", "Som vinnare"], ["lost", "Som ej vald"]]) : null,
    ],
  };
}

function panelView() {
  const st = S.pub;
  if (S.mode === "connecting") return { key: "conn", build: () => [h("p", { class: "eyebrow" }, "Tombolan"), h("p", { class: "muted" }, "Ansluter till servern…")] };
  if (S.mode === "offline") return {
    key: "off|" + !!anim, build: () => [
      h("p", { class: "eyebrow" }, "Ingen server"),
      h("h2", {}, "Servern svarar inte"),
      h("p", { class: "muted" }, location.protocol === "file:" ? "Starta servern med node server.js och öppna adressen den skriver ut." : "Kontrollera att servern är igång och ladda om sidan."),
    ],
  };
  if (S.mode === "login") return {
    key: `login|${S.busy}|${S.loginMsg}`, build: () => [
      h("p", { class: "eyebrow" }, "Admin"),
      h("h2", {}, "Logga in som admin"),
      h("p", { class: "muted" }, "Nyckeln står i filen admin-key.txt bredvid server.js."),
      h("form", { class: "code-form", onsubmit: (e) => { e.preventDefault(); adminLogin($("#akey").value); } },
        h("label", { class: "sr", for: "akey" }, "Adminnyckel"),
        h("input", { id: "akey", type: "password", placeholder: "Adminnyckel", autocomplete: "current-password", spellcheck: "false" }),
        h("button", { class: "btn primary", type: "submit", disabled: S.busy }, S.busy ? "Loggar in…" : "Logga in")),
      S.loginMsg ? h("p", { class: "error", text: S.loginMsg }) : null,
    ],
  };
  if (S.mode === "admin") {
    const a = S.adm;
    if (!a || !st) return { key: "a-load", build: () => [h("p", { class: "eyebrow" }, "Admin"), h("p", { class: "muted" }, "Hämtar dragningen…")] };
    const people = a.people;
    if (!people.length || S.editing) return setupView(people.length > 0);
    if (drawing()) return { key: "a-drawing|" + !!anim.demo, build: () => [h("p", { class: "eyebrow" }, anim.demo ? "Förhandsvisning" : "Admin"), h("h2", {}, "Trumman snurrar…"), h("p", { class: "muted" }, anim.demo ? "Ingen riktig dragning. Inget sparas." : "Vinnaren visas när kulan har kommit ut.")] };
    if (st.phase === "drawn" && !(anim && anim.demo)) {
      const w = a.winner; const p = w ? people[w.index] : null;
      return {
        key: `a-drawn|${st.drawId}|${S.busy}|${a.history.length}|${!!anim}|${st.joined}`, build: () => [
          h("p", { class: "eyebrow" }, "Bara du ser det här"),
          h("h2", { class: "winner", text: w ? w.name : "Okänd" }),
          h("p", { class: "muted" }, p ? `drogs ur trumman. ${p.name} hade ${kulor(p.balls)} av ${st.total} (${pct(p.balls, st.total)} chans). Vinnaren ser det på sin skärm, de andra ser att det inte blev de.` : "Vinnaren ser det på sin skärm."),
          h("div", { class: "actions" },
            h("button", { class: "btn primary", type: "button", disabled: S.busy || !!anim, onclick: onReset }, "Ny dragning"),
            h("button", { class: "btn ghost", type: "button", disabled: !!anim || !S.lastOutcome, onclick: replay }, "Visa igen")),
          h("details", {}, h("summary", {}, "Koder och länkar"), codesList()),
          historyBlock(),
        ],
      };
    }
    return {
      key: `a-lobby|${st.rev}|${st.joined}|${S.busy}|${!!anim}|${a.history.length}`, build: () => [
        h("p", { class: "eyebrow" }, "Admin · lotterna är klara"),
        h("h2", {}, `${kulor(st.total)} i trumman`),
        h("p", { class: "muted" }, `${st.joined} av ${st.count} har öppnat sin lott. Skicka länken privat till var och en, koden ligger i länken.`),
        codesList(),
        h("div", { class: "actions" }, h("button", { class: "btn primary big", type: "button", disabled: S.busy || !!anim, onclick: onDraw }, S.busy ? "Startar…" : "Dra en vinnare")),
        previewRow("Se det deltagarna ser:", [["won", "Vinnare"], ["lost", "Inte vald"]]),
        h("div", { class: "preview" },
          h("button", { class: "link", type: "button", onclick: () => { S.editing = true; S.confirmRegen = false; S.setup = people.map((p) => ({ name: p.name, balls: p.balls })); renderPanel(true); } }, "Ändra deltagare och kulor"),
          h("button", { class: "link", type: "button", onclick: logout }, "Logga ut")),
        historyBlock(),
      ],
    };
  }
  // deltagare
  if (!st) return { key: "p-load", build: () => [h("p", { class: "eyebrow" }, "Tombolan"), h("p", { class: "muted" }, "Ansluter till dragningen…")] };
  if (!st.ready) return { key: "p-none", build: () => [h("p", { class: "eyebrow" }, "Tombolan"), h("h2", {}, "Lotterna är inte klara än"), h("p", { class: "muted" }, "Admin skapar dem snart. Sidan uppdateras av sig själv.")] };
  if (drawing()) return {
    key: "p-drawing|" + !!S.me + "|" + !!anim.demo, build: () => [
      h("p", { class: "eyebrow" }, anim.demo ? "Förhandsvisning" : "Dragning pågår"),
      h("h2", {}, "Trumman snurrar…"),
      h("p", { class: "muted" }, S.me ? (S.me.balls > 1 ? "Håll ögonen på dina gyllene kulor." : "Håll ögonen på din gyllene kula.") : "Skriv in din kod efteråt för att se om det blev du."),
    ],
  };
  if (!S.me) return {
    key: `p-code|${S.codeStatus}|${st.phase}|${!!anim}`, build: () => [
      h("p", { class: "eyebrow" }, "Tombolan"),
      h("h2", {}, "Skriv in din kod"),
      h("p", { class: "muted" }, "Du har fått en länk eller kod av admin. Den visar bara ditt eget resultat."),
      h("form", { class: "code-form", onsubmit: (e) => { e.preventDefault(); checkCode($("#code").value); } },
        h("label", { class: "sr", for: "code" }, "Din kod"),
        h("input", { id: "code", type: "text", value: S.codeDraft, placeholder: "ABCD-EFGH", maxlength: "12", autocomplete: "off", autocapitalize: "characters", spellcheck: "false", oninput: (e) => { S.codeDraft = e.target.value; } }),
        h("button", { class: "btn primary", type: "submit", disabled: S.codeStatus === "checking" }, S.codeStatus === "checking" ? "Kollar…" : "Gå med")),
      S.codeStatus === "bad" ? h("p", { class: "error", text: S.codeMsg }) : null,
      st.phase === "drawn" ? h("p", { class: "note" }, "Dragningen är redan gjord. Skriv in koden för att se ditt resultat.") : null,
    ],
  };
  if (st.phase === "drawn" && !anim?.demo) {
    const won = S.myWon && S.myWon.drawId === st.drawId ? S.myWon.won : null;
    return {
      key: `p-drawn|${st.drawId}|${won}|${!!anim}|${!!S.lastOutcome}`, build: () => [
        h("p", { class: "eyebrow" }, "Ditt resultat"),
        h("h2", {}, won == null ? "Dragningen är klar." : won ? "Det blev du." : "Inte du den här gången."),
        h("p", { class: "muted" }, won == null ? "Hämtar ditt resultat…" : won ? "Bara du och admin vet om det." : "Vinnaren har fått besked på sin skärm."),
        h("div", { class: "actions" }, h("button", { class: "btn ghost", type: "button", disabled: !!anim || !S.lastOutcome, onclick: replay }, "Visa dragningen igen")),
      ],
    };
  }
  const mine = S.me.balls || 1;
  return {
    key: `p-in|${S.me.code}|${mine}|${st.total}|${!!anim}`, build: () => [
      h("p", { class: "eyebrow" }, "Du är med"),
      h("h2", { text: S.me.name ? `Hej ${S.me.name}!` : "Du är med!" }),
      h("p", { class: "muted" }, mine > 1 ? `Dina ${mine} kulor är de gyllene med DU på.` : "Din kula är den gyllene med DU på.", ` ${kulor(st.total)} ligger i trumman, så din chans är ${pct(mine, st.total)}.`),
      h("p", { class: "status" }, "Väntar på att admin drar"),
      h("button", { class: "link", type: "button", onclick: () => { LS.del("tombola-code"); S.me = null; S.myWon = null; S.codeStatus = "idle"; refreshBalls(); renderPanel(true); updateRole(); } }, "Byt kod"),
    ],
  };
}
function renderPanel(force) {
  const v = panelView();
  if (!force && v.key === S.panelKey) return;
  const active = document.activeElement?.id;
  S.panelKey = v.key;
  panelEl.replaceChildren(...v.build().filter(Boolean));
  if (active && (active.startsWith("name-") || active === "code" || active === "akey")) $("#" + active)?.focus();
  scheduleLayout();
}
const RESULT = {
  won: ["Ditt resultat", "Det blev du!", "Bara du och admin vet om det. Håll det för dig själv.", "gold"],
  lost: ["Ditt resultat", "Inte du den här gången.", "Någon annan blev vald och har fått besked på sin skärm.", "calm"],
  admin: ["Bara du ser det här", "", "drogs ur trumman. Vinnaren ser sitt resultat på sin egen skärm.", "gold"],
  watch: ["Dragningen är klar", "Kulan är dragen.", "Skriv in din kod för att se om det blev du.", "calm"],
};
function showResult(o, isDemo) {
  if (!isDemo) S.lastOutcome = o;
  const [eb, head, sub, tone] = RESULT[o.kind] || RESULT.watch;
  $("#res-eyebrow").textContent = (isDemo ? "Förhandsvisning · " : "") + eb;
  $("#res-h").textContent = o.kind === "admin" ? (o.name || "Okänd") : head;
  $("#res-sub").textContent = o.failed ? "Resultatet kunde inte hämtas. Ladda om sidan."
    : o.kind === "admin" && o.balls ? `drogs ur trumman med ${kulor(o.balls)} av ${o.total}. Vinnaren ser sitt resultat på sin egen skärm.` : sub;
  resultEl.className = "dock result " + tone;
  resultEl.hidden = false; panelEl.hidden = true;
  $("#res-close").focus({ preventScroll: true });
  scheduleLayout();
}
function hideResult() {
  if (resultEl.hidden && !panelEl.hidden) return;
  resultEl.hidden = true; panelEl.hidden = false;
  scheduleLayout();
}
$("#res-close").addEventListener("click", closeResult);
addEventListener("keydown", (e) => { if (e.key === "Escape" && !resultEl.hidden) closeResult(); });

/* =========================================================
   Boot
   ========================================================= */
let fontsDone = false;
async function boot() {
  renderPanel(true); updateRole(); applyLayout();
  requestAnimationFrame(frame);
  await Promise.race([
    Promise.all([document.fonts.load('400 120px "Gloock"'), document.fonts.load('600 16px "Hanken Grotesk"')]).catch(() => { }),
    sleep(2500),
  ]);
  fontsDone = true;
  const paints = [paint2025, paint2026, paint2027];
  frames.forEach((f, i) => {
    f.userData.picMat.map = tex(paints[i]()); f.userData.picMat.color.set(0xffffff); f.userData.picMat.needsUpdate = true;
    f.userData.plaqueMat.map = tex(paintPlaque(f.userData.year)); f.userData.plaqueMat.needsUpdate = true;
  });
  refreshBalls();
  $("#boot").classList.add("gone");
  let st = null;
  if (location.protocol !== "file:") { try { st = await api("state"); } catch { st = null; } }
  if (!st) { S.mode = "offline"; refreshBalls(); renderPanel(true); updateRole(); return; }
  if (IS_ADMIN) {
    const key = LS.get("tombola-admin-key");
    if (key) await adminLogin(key, { silent: true }); else S.mode = "login";
  } else S.mode = "player";
  renderPanel(true); updateRole();
  onState(st);
  connect();
}
boot();
</script>
</body>
